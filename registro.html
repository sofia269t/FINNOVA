<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="estilos/index.css">
</head>
<body>
    <header>
        <a href="#"><img class="logo"src="Estilos/img/logo_img.png" alt="Logo"></a>
        <a href="#"><img class="logo-nombre"src="estilos/img/Logo.png" alt="Finnova Logo"></a>
        <h1>Registro</h1>
        <div class="user-icon">
                    <a href="index.html">inicio</a>
                    <img  src="Estilos/img/user-icon.png" alt="User Icon">
        </div>

    </header>
    <main>
        <section class="Registro">
            <form action="" method="post">
                <label for="user-name">Nombre:</label>
                <input type="text" id="user-name" name="user-name" placeholder="Ingrese su nombre" required>

                <label for="user-apellido">Apellido:</label>
                <input type="text" id="user-apellido" name="user-apellido" placeholder="Ingrese su apellido" required>

                <label for="user-number">Número de teléfono:</label>
                <input type="tel" id="user-number" name="user-number" placeholder="Ingrese su número de teléfono" required>

                <label for="user-email">Usuario:</label>
                <input type="email" id="user-email" name="user-email" placeholder="Ingrese su correo" required>

                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" placeholder="Ingrese su contraseña" required>

                <button type="submit">Iniciar Sesión</button>
            </form>
            <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
        </section>
    </main>
        <footer>
        <p> &copy; 2026 Finnova. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
