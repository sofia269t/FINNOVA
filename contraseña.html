<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="Estilos/registro.css">
</head>
<body>
    <header>
        <a href="index.html"><img class="logo"src="Estilos/img/logo_img.png" alt="Logo"></a>
        <a href="index.html"><img class="logo-nombre"src="Estilos/img/Logo.png" alt="Finnova Logo"></a>
        <h1>Registro</h1>
        <div class="user-icon">
                    <img  src="Estilos/img/user-icon.png" alt="User Icon">
        </div>

    </header>
    <main>
        <section class="Registro">
            <form action="pag.principal.html">
                
                <label for="password">Contraseña:</label>
                <input type="password" id="password" minlength="8" name="password" placeholder="Ingrese su contraseña" required>

                
                <label for="confirm-password">Confirmar Contraseña:</label>
                <input type="password" id="confirm-password" minlength="8" name="confirm-password" placeholder="Confirme su contraseña" required>

                <button type="submit">Registrarse</button>
            </form>
            <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí </a></p>
        </section>
    </main>
        <footer>
        <p> &copy; 2026 Finnova. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
