<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gastos</title>

    <link rel="stylesheet" href="css/gastos.css">
</head>

<body>

    <!-- ENCABEZADO -->
    <header class="encabezado">

        <div class="menu">☰</div>

        <div class="logo">
            LOGO
        </div>

        <h1>Gastos</h1>

        <div class="usuario">
            Nombre 👤
        </div>

    </header>


    <main class="contenido">

        <!-- ORGANIZAR -->
        <div class="organizar">
            ↕ <span>Organizar</span>
        </div>


        <div class="lista-gastos">

            <!-- SERVICIOS PÚBLICOS-->
                 
        

            <div class="tarjeta-gasto servicios">

                <div class="titulo-gasto">
                    <h2>Pago de Servicios</h2>

                    <span class="estrella">☆</span>
                </div>


                <div class="total">
                    <span>Total Pagado</span>

                    <div class="valor">
                        $0
                    </div>
                </div>


                <!-- SERVICIOS PREDETERMINADOS -->

                <div class="servicios-lista">

                    <div class="servicio">
                        <span>⚡ Energía eléctrica</span>
                        <strong>$0</strong>
                    </div>

                    <div class="servicio">
                        <span>💧 Agua / Acueducto</span>
                        <strong>$0</strong>
                    </div>

                    <div class="servicio">
                        <span>🔥 Gas</span>
                        <strong>$0</strong>
                    </div>

                    <div class="servicio">
                        <span>🌐 Internet</span>
                        <strong>$0</strong>
                    </div>

                    <div class="servicio">
                        <span>📱 Telefonía</span>
                        <strong>$0</strong>
                    </div>

                </div>


                <div class="acciones">

                    <button>
                        Ver Servicios
                    </button>

                    <button class="opciones">
                        ⋮
                    </button>

                </div>

            </div>


            <!-- GASTOS VARIOS-->
                
             

            <div class="tarjeta-gasto">

                <div class="titulo-gasto">

                    <h2>Gastos Varios</h2>

                </div>


                <div class="total">

                    <span>Total Pagado</span>

                    <div class="valor">
                        $0
                    </div>

                </div>


                <div class="acciones">

                    <button>
                        Ver Gastos Varios
                    </button>

                    <button class="opciones">
                        ⋮
                    </button>

                </div>

            </div>

        </div>


        <!-- AGREGAR GASTOS -->

        <button class="btn-agregar">
            <span>＋</span>
            Agregar gastos
        </button>

    </main>

</body>
</html>
