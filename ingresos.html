<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresos</title>

    <link rel="stylesheet" href="css/ingresos.css">
</head>

<body>

    <header class="encabezado">

        <div class="menu">☰</div>

        <div class="logo">
            LOGO
        </div>

        <h1>Ingresos</h1>

        <div class="usuario">
            Nombre 👤
        </div>

    </header>


    <main class="contenido">

        <div class="tarjeta-ingreso">

            <div class="titulo">
                <h2>Salario</h2>

                <div class="valor">
                    $ <input type="number" placeholder="0">
                </div>
            </div>

            <div class="fecha">
                <strong>Fecha:</strong>
                <span>00-00-0000</span>
            </div>

        </div>


        <button class="btn-agregar">
            <span>＋</span>
            Agregar ingresos
        </button>

    </main>

</body>
</html>
